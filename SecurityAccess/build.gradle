plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp' version '2.0.0-1.0.21'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 36
    namespace 'digital.vasic.security.access'

    defaultConfig {
        minSdk 28  // Required for Tests library compatibility
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        // Security configurations
        buildConfigField "String", "DATABASE_NAME", "\"security_access.db\""
        buildConfigField "String", "DATABASE_PASSWORD", "\"security_access_encryption_key\""
        buildConfigField "int", "MAX_PIN_ATTEMPTS", "5"
        buildConfigField "int", "PIN_LOCKOUT_DURATION_MINUTES", "30"
        buildConfigField "long", "SESSION_TIMEOUT_MS", "300000" // 5 minutes
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
        ]
    }

    composeCompiler {
        enableStrongSkippingMode = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/*', 'LICENSE-2.0.txt', 'META-INF/DEPENDENCIES',
                'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
                'META-INF/ASL2.0', 'META-INF/*.kotlin_module'
            ]
        }
    }

    

    
}

dependencies {
    // Core dependencies
    implementation project("${toolkit_context}:Main")
    implementation project("${toolkit_context}:JCommons")

    // Room with SQLCipher
    final String roomVersion = "2.7.0-alpha07"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // TODO: Add SQLCipher for encrypted database in future

    // Biometric authentication
    implementation "androidx.biometric:biometric:1.2.0-alpha05"

    // Security and cryptography
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.security:security-identity-credential:1.0.0-alpha03"

    // Lifecycle and ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    // Kotlin Flow and Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Material Design Components
    implementation "com.google.android.material:material:1.12.0"

    // Compose UI
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.8.3"

    // Activity and Fragment
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    // RecyclerView for lists
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // ConstraintLayout
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Lottie for animations
    implementation "com.airbnb.android:lottie-compose:6.6.2"

    // Testing dependencies
    testImplementation project(":Tests")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    androidTestImplementation project(":Tests")
    androidTestImplementation "androidx.test:runner:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
}